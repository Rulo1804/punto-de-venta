<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Proveedores · Verde POS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('proveedores')}"></div>

<div class="vp-body">

    <main class="vp-main">

        <div class="vp-card">

            <div class="vp-page-header">

                <div>

                    <span class="vp-badge-count"
                          th:text="${proveedores.size()} + ' registros'">
                        0 registros
                    </span>

                    <h1>Proveedores</h1>

                    <p class="vp-subtitle">
                        Administra los proveedores de tu negocio.
                    </p>

                </div>

                <a th:href="@{/proveedores/nueva}"
                   class="vp-btn vp-btn-primary">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         xmlns="http://www.w3.org/2000/svg">

                        <path d="M12 5v14M5 12h14"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"/>

                    </svg>

                    Agregar

                </a>

            </div>


            <div class="vp-table-wrap">

                <table class="vp-table">

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Dirección</th>
                        <th>Acciones</th>
                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="proveedor : ${proveedores}">

                        <td th:text="${proveedor.idProveedor}"></td>

                        <td th:text="${proveedor.nombre}"></td>

                        <td th:text="${proveedor.telefono}"></td>

                        <td th:text="${proveedor.email}"></td>

                        <td th:text="${proveedor.direccion}"></td>


                        <td>

                            <div class="vp-actions">

                                <!-- EDITAR -->

                                <a th:href="@{/proveedores/editar/{id}(id=${proveedor.idProveedor})}"
                                   class="vp-icon-btn"
                                   title="Editar">

                                    <svg viewBox="0 0 24 24"
                                         fill="none"
                                         xmlns="http://www.w3.org/2000/svg">

                                        <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"
                                              stroke="currentColor"
                                              stroke-width="1.7"
                                              stroke-linejoin="round"/>

                                    </svg>

                                </a>


                                <!-- ELIMINAR -->

                                <a th:href="@{/proveedores/eliminar/{id}(id=${proveedor.idProveedor})}"
                                   class="vp-icon-btn danger"
                                   title="Eliminar"
                                   onclick="return confirm('¿Eliminar este proveedor?');">

                                    <svg viewBox="0 0 24 24"
                                         fill="none"
                                         xmlns="http://www.w3.org/2000/svg">

                                        <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"
                                              stroke="currentColor"
                                              stroke-width="1.7"
                                              stroke-linecap="round"
                                              stroke-linejoin="round"/>

                                    </svg>

                                </a>

                            </div>

                        </td>

                    </tr>


                    <!-- Si no existen proveedores -->

                    <tr th:if="${proveedores.isEmpty()}">

                        <td colspan="6"
                            class="vp-table-empty">

                            Aún no hay proveedores registrados.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
