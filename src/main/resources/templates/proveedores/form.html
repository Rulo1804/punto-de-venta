<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title th:text="${proveedor.idProveedor == null} ? 'Nuevo Proveedor · Verde POS' : 'Editar Proveedor · Verde POS'">
        Proveedor
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('proveedores')}"></div>

<div class="vp-body">
    <main class="vp-main">
        <div class="vp-card">

            <div class="vp-page-header">
                <div>
                    <h1 th:text="${proveedor.idProveedor == null} ? 'Nuevo proveedor' : 'Editar proveedor'">
                        Nuevo proveedor
                    </h1>

                    <p class="vp-subtitle">
                        Completa la información del proveedor.
                    </p>
                </div>
            </div>

            <form th:action="@{/proveedores/guardar}"
                  th:object="${proveedor}"
                  method="post"
                  class="vp-form">

                <!-- ID oculto para saber si es nuevo o edición -->
                <input type="hidden" th:field="*{idProveedor}">

                <div class="vp-form-group">
                    <label for="nombre">Nombre</label>

                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           placeholder="Ej. Coca-Cola"
                           required>
                </div>

                <div class="vp-form-group">
                    <label for="telefono">Teléfono</label>

                    <input type="text"
                           id="telefono"
                           th:field="*{telefono}"
                           placeholder="Ej. 3312345678">
                </div>

                <div class="vp-form-group">
                    <label for="email">Email</label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="Ej. proveedor@email.com">
                </div>

                <div class="vp-form-group">
                    <label for="direccion">Dirección</label>

                    <input type="text"
                           id="direccion"
                           th:field="*{direccion}"
                           placeholder="Ej. Av. México #123">
                </div>

                <div class="vp-form-actions">

                    <button type="submit"
                            class="vp-btn vp-btn-primary">
                        Guardar
                    </button>

                    <a th:href="@{/proveedores}"
                       class="vp-btn vp-btn-outline">
                        Regresar
                    </a>

                </div>

            </form>

        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
