<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Clientes · Verde POS</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('clientes')}"></div>


<div class="vp-body">

    <main class="vp-main">

        <div class="vp-card">

            <div class="vp-page-header">

                <div>

                    <span class="vp-badge-count"
                          th:text="${clientes.size()} + ' registros'">
                        0 registros
                    </span>

                    <h1>Clientes</h1>

                    <p class="vp-subtitle">
                        Administra los clientes de tu negocio.
                    </p>

                </div>



                <a th:href="@{/clientes/nueva}"
                   class="vp-btn vp-btn-primary">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         xmlns="http://www.w3.org/2000/svg">

                        <path d="M12 5v14M5 12h14"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"/>

                    </svg>

                    Agregar

                </a>

            </div>


            <div class="vp-table-wrap">

                <table class="vp-table">

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Email</th>


                    </tr>

                    </thead>


                    <tbody>


                    <tr th:each="cliente : ${clientes}">

                        <td th:text="${cliente.idCliente}"></td>

                        <td th:text="${cliente.nombre}"></td>

                        <td th:text="${cliente.telefono}"></td>

                        <td th:text="${cliente.email}"></td>



                        <td>

                            <div class="vp-actions">


                                <a th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}"
                                   class="vp-icon-btn"
                                   title="Editar">

                                    <svg viewBox="0 0 24 24"
                                         fill="none"
                                         xmlns="http://www.w3.org/2000/svg">

                                        <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"
                                              stroke="currentColor"
                                              stroke-width="1.7"
                                              stroke-linejoin="round"/>

                                    </svg>

                                </a>



                                <a th:href="@{/clientes/eliminar/{id}(id=${cliente.idCliente})}"
                                   class="vp-icon-btn danger"
                                   title="Eliminar"
                                   onclick="return confirm('¿Eliminar este cliente?');">

                                    <svg viewBox="0 0 24 24"
                                         fill="none"
                                         xmlns="http://www.w3.org/2000/svg">

                                        <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"
                                              stroke="currentColor"
                                              stroke-width="1.7"
                                              stroke-linecap="round"
                                              stroke-linejoin="round"/>

                                    </svg>

                                </a>

                            </div>

                        </td>

                    </tr>



                    <tr th:if="${clientes.isEmpty()}">

                        <td colspan="6"
                            class="vp-table-empty">

                            Aún no hay clientes registrados.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
