<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Ventas · Verde POS</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('ventas')}"></div>

<div class="vp-body">

    <main class="vp-main">

        <div class="vp-card">

            <div class="vp-page-header">

                <div>

                    <span
                            class="vp-badge-count"
                            th:text="${ventas.size()} + ' ventas'">
                        0 ventas
                    </span>

                    <h1>Ventas</h1>

                    <p class="vp-subtitle">
                        Consulta las ventas realizadas.
                    </p>

                </div>

                <a
                        th:href="@{/ventas/nueva}"
                        class="vp-btn vp-btn-primary">

                    <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg">

                        <path
                                d="M12 5v14M5 12h14"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"/>

                    </svg>

                    Nueva venta

                </a>

            </div>


            <div class="vp-table-wrap">

                <table class="vp-table">

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Total</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="venta : ${ventas}">

                        <td th:text="${venta.idVenta}">
                            1
                        </td>

                        <td
                                th:text="${venta.cliente != null ? venta.cliente.nombre : 'Sin cliente'}">
                            Cliente
                        </td>

                        <td th:text="${venta.fecha}">
                            Fecha
                        </td>

                        <td th:text="${venta.total}">
                            $0.00
                        </td>

                    </tr>


                    <tr th:if="${ventas.isEmpty()}">

                        <td
                                colspan="4"
                                class="vp-table-empty">

                            Aún no hay ventas.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
