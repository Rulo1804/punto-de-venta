<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Productos · Verde POS</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('productos')}"></div>


<div class="vp-body">

    <main class="vp-main">

        <div class="vp-card">

            <div class="vp-page-header">

                <div>

                    <span class="vp-badge-count"
                          th:text="${productos.size()} + ' registros'">
                        0 registros
                    </span>

                    <h1>Productos</h1>

                    <p class="vp-subtitle">
                        Administra los productos de tu negocio.
                    </p>

                </div>


                <a th:href="@{/productos/nueva}"
                   class="vp-btn vp-btn-primary">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         xmlns="http://www.w3.org/2000/svg">

                        <path d="M12 5v14M5 12h14"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"/>

                    </svg>

                    Agregar

                </a>

            </div>


            <div class="vp-table-wrap">

                <table class="vp-table">

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Proveedor</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="producto : ${productos}">

                        <td th:text="${producto.idProducto}"></td>

                        <td th:text="${producto.nombre}"></td>

                        <td th:text="${producto.categoria != null
                            ? producto.categoria.nombre
                            : 'Sin categoría'}">
                        </td>

                        <td th:text="${producto.proveedor != null
                            ? producto.proveedor.nombre
                            : 'Sin proveedor'}">
                        </td>

                        <td th:text="${producto.precioVenta}"></td>

                        <td th:text="${producto.stock}"></td>


                        <td>

                            <div class="vp-actions">

                                <!-- EDITAR -->

                                <a th:href="@{/productos/editar/{id}(id=${producto.idProducto})}"
                                   class="vp-icon-btn"
                                   title="Editar">

                                    <svg viewBox="0 0 24 24"
                                         fill="none"
                                         xmlns="http://www.w3.org/2000/svg">

                                        <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"
                                              stroke="currentColor"
                                              stroke-width="1.7"
                                              stroke-linejoin="round"/>

                                    </svg>

                                </a>


                                <!-- ELIMINAR -->

                                <a th:href="@{/productos/eliminar/{id}(id=${producto.idProducto})}"
                                   class="vp-icon-btn danger"
                                   title="Eliminar"
                                   onclick="return confirm('¿Eliminar este producto?');">

                                    <svg viewBox="0 0 24 24"
                                         fill="none"
                                         xmlns="http://www.w3.org/2000/svg">

                                        <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"
                                              stroke="currentColor"
                                              stroke-width="1.7"
                                              stroke-linecap="round"
                                              stroke-linejoin="round"/>

                                    </svg>

                                </a>

                            </div>

                        </td>

                    </tr>


                    <!-- SIN PRODUCTOS -->

                    <tr th:if="${productos.isEmpty()}">

                        <td colspan="7"
                            class="vp-table-empty">

                            Aún no hay productos registrados.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
