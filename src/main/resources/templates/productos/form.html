<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="${producto.idProducto == null}
        ? 'Nuevo Producto · Verde POS'
        : 'Editar Producto · Verde POS'">
        Producto
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('productos')}"></div>


<div class="vp-body">

    <main class="vp-main">

        <div class="vp-card">

            <div class="vp-page-header">

                <div>

                    <h1 th:text="${producto.idProducto == null}
                        ? 'Nuevo producto'
                        : 'Editar producto'">
                        Nuevo producto
                    </h1>

                    <p class="vp-subtitle">
                        Completa la información del producto.
                    </p>

                </div>

            </div>


            <form th:action="@{/productos/guardar}"
                  th:object="${producto}"
                  method="post"
                  class="vp-form">


                <!-- ID -->
                <input type="hidden"
                       th:field="*{idProducto}">


                <!-- NOMBRE -->

                <div class="vp-form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           placeholder="Ej. Coca-Cola 600ml"
                           required>

                </div>


                <!-- CATEGORÍA -->

                <div class="vp-form-group">

                    <label for="categoria">
                        Categoría
                    </label>

                    <select id="categoria"
                            name="categoriaId"
                            required>

                        <option value="">
                            Selecciona una categoría
                        </option>

                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.idCategoria}"
                                th:text="${categoria.nombre}"
                                th:selected="${producto.categoria != null
                                    and producto.categoria.idCategoria == categoria.idCategoria}">
                        </option>

                    </select>

                </div>


                <!-- PROVEEDOR -->

                <div class="vp-form-group">

                    <label for="proveedor">
                        Proveedor
                    </label>

                    <select id="proveedor"
                            name="proveedorId"
                            required>

                        <option value="">
                            Selecciona un proveedor
                        </option>

                        <option th:each="proveedor : ${proveedores}"
                                th:value="${proveedor.idProveedor}"
                                th:text="${proveedor.nombre}"
                                th:selected="${producto.proveedor != null
                                    and producto.proveedor.idProveedor == proveedor.idProveedor}">
                        </option>

                    </select>

                </div>


                <!-- PRECIO -->

                <div class="vp-form-group">

                    <label for="precioVenta">
                        Precio de venta
                    </label>

                    <input type="number"
                           id="precioVenta"
                           th:field="*{precioVenta}"
                           step="0.01"
                           min="0.01"
                           placeholder="Ej. 25.50"
                           required>

                </div>


                <!-- STOCK -->

                <div class="vp-form-group">

                    <label for="stock">
                        Stock
                    </label>

                    <input type="number"
                           id="stock"
                           th:field="*{stock}"
                           min="0"
                           placeholder="Ej. 20"
                           required>

                </div>


                <!-- BOTONES -->

                <div class="vp-form-actions">

                    <button type="submit"
                            class="vp-btn vp-btn-primary">

                        Guardar

                    </button>

                    <a th:href="@{/productos}"
                       class="vp-btn vp-btn-outline">

                        Regresar

                    </a>

                </div>

            </form>

        </div>

    </main>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
