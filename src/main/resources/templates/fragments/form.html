<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title th:text="${entidad.id == null} ? 'Nuevo registro · Verde POS' : 'Editar registro · Verde POS'">Entidad</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>


<div th:replace="~{fragments/navbar :: navbar('entidad')}"></div>

<div class="vp-body">
    <main class="vp-main">
        <div class="vp-card">

            <div class="vp-page-header">
                <div>
                    <h1 th:text="${entidad.id == null} ? 'Nuevo registro' : 'Editar registro'">Nuevo registro</h1>
                    <p class="vp-subtitle">Completa los datos del registro.</p>
                </div>
            </div>

            <form th:action="@{/entidad/guardar}" th:object="${entidad}" method="post" class="vp-form">


                <input type="hidden" th:field="*{id}">


                <div class="vp-form-group">
                    <label for="campo1">Campo 1</label>
                    <input type="text" id="campo1" th:field="*{campo1}" placeholder="Ej. valor" required>
                </div>

                <div class="vp-form-group">
                    <label for="campo2">Campo 2</label>
                    <input type="text" id="campo2" th:field="*{campo2}" placeholder="Ej. valor">
                </div>



                <div class="vp-form-actions">
                    <button type="submit" class="vp-btn vp-btn-primary">Guardar</button>

                    <a th:href="@{/entidad}" class="vp-btn vp-btn-outline">Regresar</a>
                </div>
            </form>

        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
